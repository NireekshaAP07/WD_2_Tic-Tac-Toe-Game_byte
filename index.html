    .game-panel {

    .turn-card {

      gap: .7rem;
      min-height: 3rem;
      margin-bottom: 1rem;
      color: var(--ink);

    .turn-dot {

      background: var(--x);
      box-shadow: 0 0 0 5px var(--soft-accent);

    }

    .player-row {

    .player-chip {

    .theme-option {

        pageBg: "#f4f0fa", panel: "#fefcff", board: "#faf7fe", ink: "#302445",
        muted: "#6d637c", line: "#ddd2e8", x: "#8f4e88", o: "#4b5192",
        accent: "#5c3b83", softAccent: "#e4dcf4", win: "#e5d390", shadow: "rgba(57, 39, 80, 0.15)"
      },
      sage: {
        pageBg: "#f1f5ec", panel: "#fdfffa", board: "#f8fbf4", ink: "#263c2c",
        muted: "#627166", line: "#d1dfc9", x: "#ad5347", o: "#2f6a49",
        accent: "#2f6a49", softAccent: "#dce9d6", win: "#dfe29b", shadow: "rgba(41, 76, 48, 0.14)"
      },
      blue: {
        pageBg: "#eef5fa", panel: "#fbfdff", board: "#f5faff", ink: "#20324d",
        muted: "#61708a", line: "#ccdeeb", x: "#b64c5c", o: "#245b91",
        accent: "#245b91", softAccent: "#d9e9f5", win: "#e5d58f", shadow: "rgba(34, 68, 110, 0.14)"
      },
      peach: {
        pageBg: "#fff1e9", panel: "#fffdfb", board: "#fff8f3", ink: "#482833",
        muted: "#7e6167", line: "#efcfbf", x: "#9d3d50", o: "#5f657f",
        accent: "#7f3043", softAccent: "#f6d7c4", win: "#f2da90", shadow: "rgba(103, 49, 54, 0.14)"
      }
    };

    const positions = [
      "Top left", "Top middle", "Top right",
      "Middle left", "Center", "Middle right",
      "Bottom left", "Bottom middle", "Bottom right"
    ];

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const cells = Array.from(document.querySelectorAll(".cell"));
    const board = document.getElementById("board");
    const turnLabel = document.getElementById("turn-label");
    const turnDot = document.getElementById("turn-dot");
    const xPlayer = document.getElementById("x-player");
    const oPlayer = document.getElementById("o-player");
    const playAgain = document.getElementById("play-again");
    const messages = {
      X: document.getElementById("x-win-message"),
      O: document.getElementById("o-win-message"),
      draw: document.getElementById("draw-message")
    };

    let game = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;

    function updateTurnDisplay() {
      if (gameOver) return;
      turnLabel.textContent = "Player " + currentPlayer + "’s Turn";
      const isX = currentPlayer === "X";
      xPlayer.classList.toggle("active", isX);
      oPlayer.classList.toggle("active", !isX);
      turnDot.style.backgroundColor = isX ? "var(--x)" : "var(--o)";
      turnDot.style.boxShadow = isX
        ? "0 0 0 5px var(--soft-accent)"
        : "0 0 0 5px var(--soft-accent)";
    }

    function clearMessages() {
      Object.values(messages).forEach(message => message.classList.remove("show"));
    }

    function findWinner() {
      for (const line of winningLines) {
        const [a, b, c] = line;
        if (game[a] && game[a] === game[b] && game[a] === game[c]) {
          return { player: game[a], line };
        }
      }
      return null;
    }

    function endGame(result) {
      gameOver = true;
      cells.forEach(cell => { cell.disabled = true; });
      xPlayer.classList.remove("active");
      oPlayer.classList.remove("active");

      if (result.player) {
        result.line.forEach(index => cells[index].classList.add("winner"));
        turnLabel.textContent = "Game complete";
        messages[result.player].classList.add("show");
      } else {
        turnLabel.textContent = "Game complete";
        messages.draw.classList.add("show");
      }

      playAgain.hidden = false;
    }

    function makeMove(index) {
      if (gameOver || game[index]) return;

      game[index] = currentPlayer;
      const cell = cells[index];
      const mark = document.createElement("span");
      mark.textContent = currentPlayer;
      cell.appendChild(mark);
      cell.classList.add("placed", currentPlayer === "X" ? "mark-x" : "mark-o");
      cell.disabled = true;
      cell.setAttribute("aria-label", positions[index] + ", " + currentPlayer);

      const winner = findWinner();
      if (winner) {
        endGame(winner);
        return;
      }

      if (game.every(Boolean)) {
        endGame({});
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateTurnDisplay();
    }

    function resetGame() {
      game = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;
      clearMessages();
      playAgain.hidden = true;

      cells.forEach((cell, index) => {
        cell.disabled = false;
        cell.className = "cell";
        cell.replaceChildren();
        cell.setAttribute("aria-label", positions[index] + ", empty");
      });

      updateTurnDisplay();
      cells[0].focus();
    }

    function applyTheme(themeName) {
      const theme = themes[themeName];
      const root = document.documentElement;

      root.style.setProperty("--page-bg", theme.pageBg);
      root.style.setProperty("--panel", theme.panel);
      root.style.setProperty("--board", theme.board);
      root.style.setProperty("--ink", theme.ink);
      root.style.setProperty("--muted", theme.muted);
      root.style.setProperty("--line", theme.line);
      root.style.setProperty("--x", theme.x);
      root.style.setProperty("--o", theme.o);
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--soft-accent", theme.softAccent);
      root.style.setProperty("--win", theme.win);
      root.style.setProperty("--shadow", theme.shadow);

      document.querySelectorAll(".theme-option").forEach(button => {
        const chosen = button.dataset.theme === themeName;
        button.setAttribute("aria-pressed", String(chosen));
      });
    }

    cells.forEach(cell => {
      cell.addEventListener("click", () => makeMove(Number(cell.dataset.index)));
    });

    document.getElementById("reset-game").addEventListener("click", resetGame);
    playAgain.addEventListener("click", resetGame);

    document.querySelectorAll(".theme-option").forEach(button => {
      button.addEventListener("click", () => applyTheme(button.dataset.theme));
    });

    updateTurnDisplay();
    lucide.createIcons();
  </script>
 
</body></html>
